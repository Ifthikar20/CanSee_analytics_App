# Plaintext / bare-IP deployment.
#
# Selected by setting NGINX_CONF=nginx.http.conf in docker/.env on the host.
# The default remains nginx.prod.conf (domain + TLS).
#
# This file exists because a bare IP address cannot be given a trusted TLS
# certificate -- no certificate authority will issue one -- so a deployment
# reached only by IP has to serve plaintext until a domain is attached.
#
# It must be paired with PUBLIC_SCHEME=http in .env.prod. The pairing is
# enforced at deploy time by core.checks.check_public_scheme (core.E004-E006),
# not by convention: with PUBLIC_SCHEME=https and this file mounted, Django
# 301-redirects every request to an https:// port nothing is bound to.
#
# Differences from nginx.prod.conf, all deliberate:
#   * no :443 server and no ssl_certificate -- nginx refuses to start when a
#     declared certificate file is missing, which is the state of a fresh box
#   * no "return 301 https://" anywhere -- the redirect targets a listener
#     that does not exist here
#   * no Strict-Transport-Security -- see the note in the server block
#   * listen 80 default_server with server_name _ -- the box is reached by a
#     bare IP that would otherwise have to be hardcoded. Host validation stays
#     in Django's ALLOWED_HOSTS, which is stricter than server_name matching.
#   * connect-src allows ws: as well as wss: in the CSP
#
# Everything below the security headers is byte-identical to nginx.prod.conf.
# When editing one, edit both -- core/tests/test_nginx_conf.py asserts the
# properties that must not drift apart.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    upstream django {
        server web:8000;
    }

    server {
        listen 80 default_server;
        server_name _;

        client_max_body_size 20M;

        error_page 502 504 /__errors/50x.html;
        error_page 503 /__errors/maintenance.html;

        location ^~ /__errors/ {
            internal;
            alias /etc/nginx/errors/;
            add_header Retry-After 120 always;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
        }

        # ── Maintenance switch ──
        # Flip on:  docker compose -f docker/docker-compose.prod.yml exec nginx touch /etc/nginx/maintenance.on
        # Flip off: docker compose -f docker/docker-compose.prod.yml exec nginx rm /etc/nginx/maintenance.on

        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_proxied any;
        gzip_comp_level 4;
        gzip_types
            text/plain
            text/css
            text/javascript
            application/javascript
            application/json
            application/xml
            image/svg+xml;

        # ── Security Headers ──
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # NO Strict-Transport-Security here, deliberately. Do not copy it back
        # from nginx.prod.conf. HSTS is the one header with a persistent
        # client-side effect: a browser that has seen it for a host refuses
        # plaintext for that host until max-age expires, and there is no
        # server-side undo. Emitting it from a plaintext deployment would
        # poison every visitor's browser against the only scheme this
        # deployment can serve.

        # Mirrors nginx.prod.conf's CSP with the scheme-specific sources
        # corrected: ws: alongside wss:, and no https:-only connect-src that
        # would push the SPA into a mixed-content upgrade the browser blocks.
        # frame-src https: lets the agent workspace show pages live.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://consent.cookiebot.com https://consentcdn.cookiebot.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; media-src 'self'; connect-src 'self' ws: wss:; frame-src https:; frame-ancestors 'none'; form-action 'self'; object-src 'none'; base-uri 'self'" always;

        # ── Django Static Files ──
        location /static/ {
            alias /static/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ── Health Check ──
        location /health/ {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            access_log off;
        }

        # ── Django Admin ──
        # This path MUST match ADMIN_URL in .env.prod. nginx only
        # proxies the locations named here; anything else falls
        # through to the SPA catch-all and silently returns
        # index.html instead of the admin login.
        location /ops-ed4aaf863d969e541d/ {
            if (-f /etc/nginx/maintenance.on) { return 503; }
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Agent process (runs, event streams, browse) ──
        # The agent service is optional (compose profile "agent"). The upstream
        # is a variable so nginx starts without it and resolves it per request
        # through Docker's DNS; when it is down or absent the SPA gets a JSON
        # 503 agent_unavailable instead of the HTML error page. Streams need
        # buffering and gzip off and a read timeout longer than the 15 s ping.
        location ^~ /api/v1/agent/live/ {
            if (-f /etc/nginx/maintenance.on) { return 503; }
            resolver 127.0.0.11 valid=10s ipv6=off;
            resolver_timeout 2s;
            set $agent_upstream http://agent:8000;
            proxy_pass $agent_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 300s;
            client_max_body_size 2m;
            error_page 502 504 = @agent_unavailable;
        }
        location @agent_unavailable {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            add_header Retry-After 15 always;
            add_header X-Content-Type-Options nosniff always;
            return 503 '{"success":false,"error":{"code":"agent_unavailable","message":"The agent is temporarily unavailable."}}';
        }

        # ── API Proxy ──
        location /api/ {
            if (-f /etc/nginx/maintenance.on) { return 503; }
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header CF-IPCountry $http_cf_ipcountry;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ── Pixel / Tracking JS (served to external websites) ──
        location = /p.js {
            alias /etc/nginx/pixel/p.min.js;
            default_type application/javascript;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Cache-Control "public, max-age=300";
            access_log off;
        }
        location /pixel/ {
            alias /etc/nginx/pixel/;
            types { application/javascript js; }
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Cache-Control "public, max-age=3600";
            access_log off;
        }

        # ── Vue SPA (catch-all — must be LAST) ──
        location / {
            if (-f /etc/nginx/maintenance.on) { return 503; }
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;

            location = /index.html {
                add_header Cache-Control "no-cache, no-store, must-revalidate";
                add_header Pragma "no-cache";
                add_header Expires "0";
            }

            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                access_log off;
            }
        }
    }
} # end http
