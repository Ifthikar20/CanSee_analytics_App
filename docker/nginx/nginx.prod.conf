worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # Connections one client holds open to the agent routes (event streams
    # and long-polls stay open), on top of the per-user cap the agent
    # enforces. Behind Cloudflare the peer address is a Cloudflare edge that
    # many visitors share, so the client is CF-Connecting-IP when present.
    # A forged header only buys a bucket of its own: no worse than no limit.
    map $http_cf_connecting_ip $agent_client {
        ""      $binary_remote_addr;
        default $http_cf_connecting_ip;
    }
    limit_conn_zone $agent_client zone=agent_live:10m;

    upstream django {
        server web:8000;
    }

    # ── Redirect HTTP → HTTPS ──
    server {
        listen 80;
        server_name cansee.ai www.cansee.ai;
        return 301 https://$host$request_uri;
    }

    # ── Allow health checks over HTTP (internal) ──
    server {
        listen 80;
        server_name 100.31.135.211 localhost;

        location /health/ {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            access_log off;
        }

        location / {
            return 301 https://cansee.ai$request_uri;
        }
    }

    # ── HTTPS Server ──
    server {
        listen 443 ssl;
        server_name cansee.ai www.cansee.ai;

        ssl_certificate     /etc/nginx/ssl/cansee.ai.pem;
        ssl_certificate_key /etc/nginx/ssl/cansee.ai.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # Forward secrecy only. The previous "HIGH:!aNULL:!MD5" still
        # permitted static-RSA and CBC-mode suites, so a recorded session
        # could be decrypted later if the private key ever leaked. This
        # list is ECDHE-only with AEAD ciphers, which removes both.
        # TLSv1.3 suites are negotiated separately and are safe by default.
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;   # client order is better on modern stacks
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;         # tickets undermine forward secrecy

        client_max_body_size 20M;

        # ── Error and maintenance pages ──
        # 502/504 are generated by nginx itself when the Django upstream is
        # down or timing out, so this needs no proxy_intercept_errors —
        # and deliberately does not intercept: errors Django *returns*
        # (DRF's JSON 4xx/5xx) pass through untouched for the SPA.
        # 503 is reserved for the maintenance switch below.
        error_page 502 504 /__errors/50x.html;
        error_page 503 /__errors/maintenance.html;

        location ^~ /__errors/ {
            internal;
            alias /etc/nginx/errors/;
            # This location declares add_header, so the server-level
            # headers (including the CSP) do not inherit here. That is
            # intentional: the pages carry inline CSS/JS by design —
            # they must render when nothing else in the stack works.
            add_header Retry-After 120 always;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
        }

        # ── Maintenance switch ──
        # Flip on:  docker compose -f docker/docker-compose.prod.yml exec nginx touch /etc/nginx/maintenance.on
        # Flip off: docker compose -f docker/docker-compose.prod.yml exec nginx rm /etc/nginx/maintenance.on
        # The flag lives in the container filesystem, so recreating the
        # container clears it — a fresh deploy can never come up stuck in
        # maintenance. /health/, /static/ and the pixel JS stay exempt:
        # health so you can verify Django is up before lifting the flag,
        # the pixel so customer sites' script tags keep resolving.

        # ── Gzip Compression ──
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_proxied any;
        gzip_comp_level 4;
        gzip_types
            text/plain
            text/css
            text/javascript
            application/javascript
            application/json
            application/xml
            image/svg+xml;

        # ── Security Headers ──
        # Inherited only by locations that set no add_header of their own;
        # the SPA's nested locations under `location /` repeat this block.
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Must match Django's SECURE_HSTS_* (base.py): 1 year, subdomains,
        # preload. nginx serves the SPA document and static assets directly,
        # so without "preload" here those responses disagreed with Django's
        # and the domain could never be accepted onto the preload list.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        # CSP for content nginx serves directly (SPA document, static).
        # Django responses already get this from SecurityHeadersMiddleware;
        # mirroring it here closes the gap for the served SPA HTML.
        # frame-ancestors is header-only (a <meta> CSP ignores it), which
        # is why this belongs at the edge, not in index.html — and index.html
        # can't carry it without breaking Vite dev.
        # script-src allows Cookiebot (consent management) only; consentcdn
        # serves its banner assets and cross-tab consent iframe. frame-src
        # takes any https page: the agent workspace's browser pane shows
        # third-party pages live in a sandboxed iframe when their own
        # headers allow framing (and falls back to a reader view otherwise).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://consent.cookiebot.com https://consentcdn.cookiebot.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; media-src 'self'; connect-src 'self' https: wss:; frame-src https:; frame-ancestors 'none'; form-action 'self'; object-src 'none'; base-uri 'self'" always;

        # ── Django Static Files ──
        location /static/ {
            alias /static/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ── Health Check ──
        location /health/ {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            access_log off;
        }

        # ── Django Admin ──
        # This path MUST match ADMIN_URL in .env.prod. nginx only
        # proxies the locations named here; anything else falls
        # through to the SPA catch-all and silently returns
        # index.html instead of the admin login.
        location /ops-ed4aaf863d969e541d/ {
            if (-f /etc/nginx/maintenance.on) { return 503; }
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Internal ops surface: NEVER internet-reachable ──
        # The ftb-min admin server calls Django directly on the private
        # network, not through this proxy. When that changes, replace the
        # 404 with `allow <admin-host-ip>; deny all;`.
        location ^~ /api/v1/internal/ {
            return 404;
        }

        # ── Agent process (runs, event streams, browse) ──
        # The agent service is optional (compose profile "agent"). The upstream
        # is a variable so nginx starts without it and resolves it per request
        # through Docker's DNS; when it is down or absent the SPA gets a JSON
        # 503 agent_unavailable instead of the HTML error page. Streams need
        # buffering and gzip off and a read timeout longer than the 15 s ping.
        location ^~ /api/v1/agent/live/ {
            if (-f /etc/nginx/maintenance.on) { return 503; }
            resolver 127.0.0.11 valid=10s ipv6=off;
            resolver_timeout 2s;
            set $agent_upstream http://agent:8000;
            proxy_pass $agent_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 300s;
            client_max_body_size 2m;
            error_page 502 504 = @agent_unavailable;
            # A location's own error_page stops the server-level one from
            # applying, so the maintenance switch above needs its own: the
            # SPA's agent client reads a JSON code, not the HTML page.
            # Without proxy_intercept_errors this only catches nginx's 503.
            error_page 503 = @agent_maintenance;
            # Over the limit: 429 with the agent's JSON envelope (the default
            # 503 would read as the maintenance page above).
            limit_conn agent_live 20;
            limit_conn_status 429;
            error_page 429 = @agent_busy;
        }
        location @agent_unavailable {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            add_header Retry-After 15 always;
            add_header X-Content-Type-Options nosniff always;
            return 503 '{"success":false,"error":{"code":"agent_unavailable","message":"The agent is temporarily unavailable."}}';
        }
        location @agent_maintenance {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            add_header Retry-After 120 always;
            add_header X-Content-Type-Options nosniff always;
            return 503 '{"success":false,"error":{"code":"maintenance","message":"Cansee is down for maintenance. Try again in a few minutes."}}';
        }
        location @agent_busy {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            add_header Retry-After 3 always;
            add_header X-Content-Type-Options nosniff always;
            return 429 '{"success":false,"error":{"code":"too_many_streams","message":"Too many open connections to the agent from your network. Close other tabs and try again."}}';
        }

        # ── API Proxy ──
        location /api/ {
            if (-f /etc/nginx/maintenance.on) { return 503; }
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Forward the country resolved at the edge so the pixel-ingest
            # endpoint can read it without an external geo lookup. Cloudflare
            # sets CF-IPCountry; if you front this with the nginx geoip2
            # module instead, set $geoip2_country here and forward it as
            # X-Geo-Country. Empty when neither is present.
            proxy_set_header CF-IPCountry $http_cf_ipcountry;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ── Pixel / Tracking JS (served to external websites) ──
        # /p.js is the v2 short-path served to all newly issued snippets.
        # /pixel/ is kept for existing installs of the legacy v1 script.
        location = /p.js {
            alias /etc/nginx/pixel/p.min.js;
            default_type application/javascript;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Cache-Control "public, max-age=300";
            access_log off;
        }
        location /pixel/ {
            alias /etc/nginx/pixel/;
            types { application/javascript js; }
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Cache-Control "public, max-age=3600";
            access_log off;
        }

        # ── Vue SPA (catch-all — must be LAST) ──
        # A location that declares any add_header inherits NONE from the
        # server level, so both nested locations below repeat the Security
        # Headers block (without it every SPA page went out with no CSP,
        # framing or HSTS header). Keep the copies identical to it.
        location / {
            if (-f /etc/nginx/maintenance.on) { return 503; }
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;

            # index.html must NEVER be cached — it references hashed asset URLs.
            # Its own inline <script> blocks (theme bootstrap, consent loader)
            # get a fresh nonce on every response, and script-src allows that
            # nonce: the CSP needs neither 'unsafe-inline' nor hashes of the
            # UI build. Only bare "<script>" tags are tagged; scripts loaded by
            # src (the bundle) are allowed by 'self'.
            location = /index.html {
                sub_filter_once off;
                sub_filter '<script>' '<script nonce="$request_id">';
                add_header Cache-Control "no-cache, no-store, must-revalidate";
                add_header Pragma "no-cache";
                add_header Expires "0";
                add_header X-Frame-Options DENY always;
                add_header X-Content-Type-Options nosniff always;
                add_header X-XSS-Protection "1; mode=block" always;
                add_header Referrer-Policy "strict-origin-when-cross-origin" always;
                add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
                add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$request_id' https://consent.cookiebot.com https://consentcdn.cookiebot.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; media-src 'self'; connect-src 'self' https: wss:; frame-src https:; frame-ancestors 'none'; form-action 'self'; object-src 'none'; base-uri 'self'" always;
            }

            # Prerendered blog pages. The UI build writes dist/blog/index.html
            # and dist/blog/<slug>/index.html (the SPA shell with the article,
            # head tags and JSON-LD baked in, for crawlers that run no
            # JavaScript); serve them at /blog and /blog/<slug> without a
            # trailing-slash redirect, and fall back to the SPA for anything
            # else. They are index.html shells, so they get the same nonce,
            # no-cache and security headers as /index.html above. try_files
            # serves the file inside this location, so the /index.html block
            # never applies to them, hence the copy (keep it identical).
            location ^~ /blog {
                if (-f /etc/nginx/maintenance.on) { return 503; }
                try_files $uri $uri/index.html /index.html;
                sub_filter_once off;
                sub_filter '<script>' '<script nonce="$request_id">';
                add_header Cache-Control "no-cache, no-store, must-revalidate";
                add_header Pragma "no-cache";
                add_header Expires "0";
                add_header X-Frame-Options DENY always;
                add_header X-Content-Type-Options nosniff always;
                add_header X-XSS-Protection "1; mode=block" always;
                add_header Referrer-Policy "strict-origin-when-cross-origin" always;
                add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
                add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$request_id' https://consent.cookiebot.com https://consentcdn.cookiebot.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; media-src 'self'; connect-src 'self' https: wss:; frame-src https:; frame-ancestors 'none'; form-action 'self'; object-src 'none'; base-uri 'self'" always;
            }

            # Hashed assets (JS, CSS, images) — cache forever
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                add_header X-Frame-Options DENY always;
                add_header X-Content-Type-Options nosniff always;
                add_header X-XSS-Protection "1; mode=block" always;
                add_header Referrer-Policy "strict-origin-when-cross-origin" always;
                add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
                add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://consent.cookiebot.com https://consentcdn.cookiebot.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; media-src 'self'; connect-src 'self' https: wss:; frame-src https:; frame-ancestors 'none'; form-action 'self'; object-src 'none'; base-uri 'self'" always;
                access_log off;
            }
        }
    }
} # end http
