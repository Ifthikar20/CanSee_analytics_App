version: "3.9"

# LOCAL DEVELOPMENT CONVENIENCE FILE ONLY.
# Real local dev uses docker-compose.dev.yml (+ .dev.override.yml); production
# uses docker-compose.prod.yml. This file loads ../.env (config.settings.dev:
# DEBUG=True, ALLOWED_HOSTS=*, CORS wildcard), so its published ports are bound
# to 127.0.0.1 ONLY and the settings module is pinned to dev explicitly, so a
# stray `docker compose up` can never expose dev-mode services to the network
# or be mistaken for a production bring-up.

services:
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: cansee
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file: ../.env
    environment:
      # Explicit dev pin: this file is dev-only. Overrides ../.env ordering
      # so it can never silently inherit the wsgi.py prod default or masquerade
      # as a production bring-up.
      DJANGO_SETTINGS_MODULE: config.settings.dev
      # The image runs gunicorn with several workers, and the agent runs in
      # one process only: each worker would treat the others' runs as
      # orphans and interrupt them. This stack has no agent process; the
      # live endpoints answer 503 agent_unavailable. Use
      # docker-compose.dev.yml (runserver is the agent process there).
      AGENT_PROCESS: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # Bound to localhost so dev-mode services (DEBUG, permissive CORS)
      # are never exposed to the network.
      - "127.0.0.1:8000:8000"
    volumes:
      - static_files:/app/staticfiles

  celery:
    build:
      context: ..
      dockerfile: docker/Dockerfile.celery
    env_file: ../.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile.celery
    env_file: ../.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
    command: ["celery", "-A", "config.celery", "beat", "--loglevel=info", "--scheduler=django_celery_beat.schedulers:DatabaseScheduler"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_files:/static:ro
    depends_on:
      - web

volumes:
  postgres_data:
  redis_data:
  static_files:
